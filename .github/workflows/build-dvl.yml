name: build-dvl

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  PLATFORM: x64
  SOLUTION_DIR: vs2026

jobs:
  build-dvl:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: ${{env.PLATFORM}}
      - name: Add CodeQL
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Path $Env:RUNNER_TEMP/tools/
          Invoke-WebRequest -Uri $Env:CODEQL_URI -OutFile $Env:RUNNER_TEMP\tools\codeql.zip
          if ((Get-FileHash $Env:RUNNER_TEMP\tools\codeql.zip -Algorithm SHA256).Hash -ine $Env:CODEQL_SHA256) {
            throw "codeql failed verification"
          }
          Expand-Archive $Env:RUNNER_TEMP\tools\codeql.zip -DestinationPath $Env:RUNNER_TEMP\tools\codeql -Force
          Add-Content -Path $Env:GITHUB_PATH -Value "$Env:RUNNER_TEMP\tools\codeql\codeql" -Force
        env:
          CODEQL_URI: https://github.com/github/codeql-cli-binaries/releases/download/v2.25.5/codeql-win64.zip
          CODEQL_SHA256: db470e09a5f94e9d262f0e1a67af1ff1c72571d567898d3a44c4b09c581afc6e
      - name: Download packs
        run: |
          codeql pack download microsoft/windows-drivers@1.10.0 microsoft/cpp-queries@0.0.5
          if ($LASTEXITCODE -ne 0) {
            throw "CodeQL download failed with error $LASTEXITCODE"
          }
      - name: Restore
        run: .\build.ps1 -Target Restore -Configuration $Env:CONFIGURATION -Platform $Env:PLATFORM -SolutionDir $Env:SOLUTION_DIR
      - name: Build drivers
        run: .\build-dvl.ps1 -Configuration $Env:CONFIGURATION -Platform $Env:PLATFORM -SolutionDir $Env:SOLUTION_DIR
      - name: Upload built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{env.SOLUTION_DIR}}/${{env.PLATFORM}}/${{env.CONFIGURATION}}
          name: release
